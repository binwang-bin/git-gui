[workspace]
resolver = "2"
members = ["crates/git-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
git-core = { path = "crates/git-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
gix = { version = "0.89", default-features = false, features = [
  "sha1",
  "status",
  "blob-diff",
  "revision",
  "index",
  "dirwalk",
  "parallel",
] }
which = "7"
dunce = "1"
tracing = "0.1"
